# TokyoNight Day theme
set -g status-style                 "bg=#e1e2e7,fg=#3760bf"
set -g status-left                  "#[fg=#3760bf,bold] #S  "
set -g status-right                 "#[fg=#6172b0] %H:%M "
set -g status-left-length           30
set -g status-right-length          20
set -g window-status-format         "#[fg=#6172b0] #I:#W "
set -g window-status-current-format "#[fg=#2e7de9,bold] #I:#W "
set -g window-status-separator      ""
set -g pane-border-style            "fg=#a1a6c5"
set -g pane-active-border-style     "fg=#2e7de9"
set -g message-style                "bg=#e1e2e7,fg=#3760bf"
set -g message-command-style        "bg=#e1e2e7,fg=#6172b0"
set -g mode-style                   "bg=#2e7de9,fg=#e1e2e7"
